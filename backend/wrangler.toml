name = "astral-backend"
main = "worker.js"
compatibility_date = "2024-11-01"

# Domaine autorisé à appeler GET /status (CORS). Pas un secret.
[vars]
ALLOWED_ORIGIN = "https://slagence.fr"

# Table clé/valeur "email -> palier". Remplace "id" par celui que
# `wrangler kv namespace create STATUS_KV` te donne (voir README.md).
kv_namespaces = [
  { binding = "STATUS_KV", id = "REMPLACE_MOI_APRES_wrangler_kv_namespace_create" }
]

# STRIPE_WEBHOOK_SECRET n'apparaît volontairement pas ici : c'est un
# secret, il ne doit jamais être commité. Il se définit avec :
#   wrangler secret put STRIPE_WEBHOOK_SECRET
# (voir README.md, étape 5)
