<div id="stage" class="L"></div>
<script>
const TL=window.TL;
// ---------- outils ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,m)=>a+(b-a)*m;
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),quint:x=>1-Math.pow(1-x,5),expo:x=>x>=1?1:1-Math.pow(2,-10*x),
  in:x=>x*x*x,inExpo:x=>x<=0?0:Math.pow(2,10*x-10),io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  io5:x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2,
  back:x=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  spring:x=>x>=1?1:1-Math.exp(-6.5*x)*Math.cos(11*x)};
const P=(t,a,b,e=E.out)=>e(clamp((t-a)/(b-a)));
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;parent.appendChild(e);return e}
const S=(e,o)=>{for(const k in o)e.style[k]=o[k]};
let _seed=11;const rnd=(a=0,b=1)=>{_seed=(_seed*16807)%2147483647;return a+(b-a)*(_seed/2147483647)};
const CHK=(c='#E8F0E6',w=2.4)=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#3C4F3B" stroke="rgba(181,205,177,.6)" stroke-width="1"/><path class="ck" d="M7 12.4l3.2 3.2L17.2 8.6" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16" stroke-dashoffset="16"/></svg>`;
const W=1080,H=1920,F=1500;

// ---------- données fictives ----------
const CATS=[{k:'U',n:'Urgences',col:'#E08A6D',c:3},{k:'D',n:'Demandes de devis',col:'#B5CDB1',c:9},{k:'C',n:'Clients',col:'#A1D3FF',c:14},{k:'F',n:'Factures',col:'#D8C8A0',c:8},{k:'N',n:'Newsletters',col:'#8A9289',c:26}];
const POOL={
 U:[['Atelier Hoffmann','Fuite sur le chantier'],['Weber Terrassement','Livraison bloquée'],['Résidence du Parc','Dégât des eaux']],
 D:[['Garage Muller','Demande de devis — bureaux'],['Schneider & Fils','Devis pour une toiture'],['SCI Les Tilleuls','Demande de chiffrage'],['Hôtel des Vosges','Devis rénovation'],['Pharmacie Klein','Devis agencement'],['Garage Muller','Relance du devis'],['Fromagerie Brand','Demande de prix'],['Studio Haas','Chiffrage cuisine'],['Café du Marché','Devis terrasse']],
 C:[['Claire Meyer','Intervention la semaine prochaine ?'],['Julie Kessler','Merci pour hier'],['Paul Lehmann','Question sur le planning'],['Sophie Haas','Photos du chantier'],['Marc Zimmer','Rendez-vous de vendredi'],['Anne Ritter','Suite à notre échange'],['Cabinet Roth','Documents du mois'],['Luc Gerber','Accès au chantier'],['Emma Wolf','Confirmation'],['Hugo Bauer','Nouvelle adresse'],['Léa Martin','Petite question'],['Nina Frey','Horaires d’ouverture'],['Tom Kuhn','Rappel'],['Inès Roy','Merci !']],
 F:[['Bauer Matériaux','Facture n°4471'],['Fischer Compta','Facture F-2026-118'],['Électricité Wolff','Avoir n°A-0312'],['Assurance Pro','Échéance trimestrielle'],['Location Matériel 68','Facture de location'],['Fischer Compta','Pièces manquantes'],['Énergie Plus','Facture d’octobre'],['Télécom Pro','Facture mobile']],
 N:[['Pro Hebdo','Les tendances de la semaine'],['Bureau+','−20 % sur les fournitures'],['Webinaire Digital','Dernières places'],['Info Pro Alsace','Agenda des salons'],['Newsletter Outils','Nouveautés du mois'],['Formation Express','Votre attestation']]
};
const order=[];CATS.forEach((c,g)=>{for(let k=0;k<c.c;k++)order.push([g,k])});
for(let i=order.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
// cartes d’ouverture : 3 premières, dont Claire en dernier plan
const CARDS=order.map(([g,k],i)=>{const c=CATS[g];const p=POOL[c.k][k%POOL[c.k].length];return {g,k,who:p[0],sj:p[1],tm:`0${7+Math.floor(rnd()*2)}:${String(Math.floor(rnd()*60)).padStart(2,'0')}`}});
const iClaire=CARDS.findIndex(c=>c.who==='Claire Meyer');
// mettre une carte générique en tête
const firsts=[CARDS.findIndex(c=>c.g===1),CARDS.findIndex(c=>c.g===3),CARDS.findIndex(c=>c.g===4)];
const SEQ=[...firsts,...CARDS.map((c,i)=>i).filter(i=>!firsts.includes(i))];

// ---------- scène ----------
const stage=document.getElementById('stage');
const shakeL=el('div','L',stage);
const bg=el('div','L',shakeL);
const BL=[[-300,300,1500,'rgba(60,79,59,.55)'],[300,1100,1300,'rgba(40,52,40,.6)'],[100,-300,900,'rgba(161,211,255,.07)']].map(([x,y,s,c])=>{const b=el('div','blob',bg);S(b,{left:x+'px',top:y+'px',width:s+'px',height:s+'px',background:`radial-gradient(circle,${c} 0%,rgba(0,0,0,0) 66%)`});return b});
const photoBg=el('div','L',shakeL);photoBg.id='photoBg';const pImg=el('img',null,photoBg);pImg.src='assets/p-bureau.jpg';
const DPR=window.devicePixelRatio||1;const cloud=el('canvas','L',shakeL);cloud.width=W*DPR;cloud.height=H*DPR;const cx=cloud.getContext('2d');
const deckL=el('div','L',shakeL);
const DL=CATS.map(c=>{const d=el('div','dl',deckL,`<u style="background:${c.col};box-shadow:0 0 16px ${c.col}"></u><b>${c.n}</b><i><span class="cn">0</span> messages</i>`);return d});

// interface
const ui=el('div','L',shakeL);ui.id='ui';
const panel=el('div',null,ui);panel.id='panel';
el('div','sheen',panel);
el('div','ph',panel,'Boîte de réception');
el('div','pill',panel,'<i></i>Tri automatique');
el('div','hr',panel);
const pl1=el('div','plbl mono',panel,'Vos priorités · aujourd’hui');pl1.style.top='164px';
const PRI=[[CARDS.find(c=>c.who==='Atelier Hoffmann'),'AH',[['Urgent','#E08A6D'],['Rappel souhaité']],'08:45',0],
  [CARDS[iClaire],'CM',[['Client','#A1D3FF'],['À répondre']],'08:47',2],
  [CARDS.find(c=>c.who==='Garage Muller'),'GM',[['Demande de devis','#B5CDB1'],['Nouveau client']],'08:49',1]];
const PC=PRI.map(([c,ini,tags,tm,g],k)=>{
  const d=el('div','pc',panel,`<div class="bar" style="background:${CATS[g].col};box-shadow:0 0 18px ${CATS[g].col}"></div><div class="av">${ini}</div><div class="w">${c.who}</div><div class="s">${c.sj}</div><div class="tm">${tm}</div>
   <div class="tg">${tags.map(([l,col])=>`<span class="chip" style="${col?`color:${col};background:${col}22`:'color:#BFC5BE;background:rgba(255,255,255,.07)'}">${l}</span>`).join('')}</div>`);
  d.style.top=(206+k*188)+'px';return d});
const done=[PC[1],PC[2]].map((d,k)=>{const x=el('span','chip',d.querySelector('.tg'),k?'✓ Brouillon prêt':'✓ Réponse prête');S(x,{color:'#E3ECE1',background:'rgba(60,79,59,.9)',position:'absolute',left:0,top:0,opacity:0});return x});
const pl2=el('div','plbl mono',panel,'Catégories');pl2.style.top='792px';
function slotHTML(n){return `<span class="slot">${String(n).split('').map(()=>`<span>${[...Array(11).keys()].map(d=>`<span>${d%10}</span>`).join('')}</span>`).join('')}</span>`}
const CR=CATS.map((c,g)=>{const d=el('div','crow',panel,`<u style="background:${c.col};box-shadow:0 0 12px ${c.col}"></u><b>${c.n}</b><div class="cnt">${slotHTML(c.c+(g===1?1:0))}</div>`);d.style.top=(834+g*86)+'px';return d});
function setSlot(root,v){ // valeur continue -> colonnes de chiffres
  const cols=root.querySelectorAll('.slot>span');const n=cols.length;
  for(let i=0;i<n;i++){const p=Math.pow(10,n-1-i);const pos=Math.floor(v/p)%10+clamp((v%p)-(p-1));cols[i].style.transform=`translateY(${-pos}em)`}
  if(n>1)cols[0].style.opacity=clamp(v-9);
}
const nm=el('div',null,ui);nm.id='nm';
nm.innerHTML=`<div class="k mono">Nouveau message</div><div class="w">Schmitt Immobilier</div><div class="s">Devis pour la rénovation d’un appartement</div><div class="scan"></div><div class="stamp"><span class="chip" style="color:#B5CDB1;background:#B5CDB126;font-size:22px;padding:9px 16px">Demande de devis</span></div>`;
const nmScan=nm.querySelector('.scan'),nmStamp=nm.querySelector('.stamp');
const TILES=['Priorités<br>identifiées','Réponses<br>préparées','Messages<br>classés'].map((t,i)=>{const d=el('div','tile',ui,`${t}${CHK()}`);S(d,{left:(70+i*320)+'px',top:'1520px'});return d});

// réponse
const reply=el('div','L',shakeL);reply.id='reply';const rwrap=el('div',null,reply);rwrap.id='rwrap';
const bub=el('div','card',rwrap,`<div class="av">CM</div><div class="n">Claire Meyer</div><div class="m">claire.meyer@exemple.fr · 08:47</div><div class="q">« Bonjour, êtes-vous disponibles pour une intervention la semaine prochaine ? »</div>`);bub.id='bub';
const draft=el('div','card',rwrap,`<div class="h mono">Brouillon · préparé automatiquement</div><div class="demo">Données de démonstration</div><div id="dt"></div>`);draft.id='draft';

const RT=[['Bonjour '],['Claire',1],[',\n\nNous pouvons intervenir '],['la semaine prochaine',1],[' : '],['mardi à 14 h ou jeudi à 9 h',1],['.\nQuel créneau vous convient le mieux ?\n\nBien cordialement,\nL’équipe Lambert Rénovation']];
const CH=[],HLS=[];RT.forEach(([s,h])=>{let host=dt;if(h){host=el('span','hl',dt);HLS.push({bg:host,start:CH.length,len:s.length})}for(const c of s){const sp=el('span',null,host);sp.textContent=c;CH.push(sp)}});

const togTh=el('div','th',tog);

function camPos(c,t){ // position caméra-espace en mode nuage (t<=drop)
  const tc=Math.min(t,TL.freeze);
  const life=clamp((tc-c.spawn)/.12);
  let p, sc=1;

    sc=E.spring(clamp((tc-c.spawn)/.55));

    const fl=E.expo(clamp((tc-c.spawn)/1.0));
    const o={x:CC.x*0,y:0,z:2200};
    p={x:lerp(o.x,c.cloud.x,fl),y:lerp(o.y,c.cloud.y,fl),z:lerp(o.z,c.cloud.z,fl)};
  }
  p=rotY(p,swirl(tc),CC);

    const tA=P(t,TL.typing[1]+.05,TL.typing[1]+.5,E.expo);S(tog,{opacity:tA*(1-rOut),transform:`translateY(${(1-tA)*40}px)`});

    S(send,{opacity:sA*(1-rOut),transform:`translateY(${(1-sA)*30}px) scale(${1-pr*.07})`,boxShadow:`0 20px 50px rgba(255,255,255,${.12+.3*P(t,TL.toggle+.6,TL.press,E.io)})`});

    const sA=P(t,32.6,33.2,E.expo);S(sub,{opacity:sA,transform:`translateY(${(1-sA)*24}px)`});
  }

  // ---- lumière (fx) ----
  fc.setTransform(DPR,0,0,DPR,0,0);fc.clearRect(0,0,W,H);fc.globalCompositeOperation='lighter';
  const glow=(x,y,r,col,a)=>{if(a<=0.003)return;const g=fc.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col.replace('A',a));g.addColorStop(1,col.replace('A',0));fc.fillStyle=g;fc.fillRect(x-r,y-r,2*r,2*r)};
  // explosion
  glow(540,960,900*P(t,TL.boom,TL.boom+.5),'rgba(200,225,195,A)',.5*(1-P(t,TL.boom,TL.boom+.8)));
  // onde de choc
  if(t>TL.drop-.02&&t<TL.drop+1.2){const k=P(t,TL.drop,TL.drop+1.0,E.out);const R=60+1900*k;
    fc.save();fc.strokeStyle=`rgba(190,220,185,${(1-k)*.9})`;fc.lineWidth=lerp(40,4,k);fc.shadowColor='rgba(160,200,150,.9)';fc.shadowBlur=60;

  flash.style.opacity=fa.toFixed(3);flash.style.background=t>TL.drop&&t<TL.drop+1?'#DDEBD8':'#fff';
