<script>
const TL = window.TL || {};
// ---------- utilitaires ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,m)=>a+(b-a)*m;
const E={
  lin:x=>x,
  out:x=>1-Math.pow(1-x,3),
  quint:x=>1-Math.pow(1-x,5),
  expo:x=>x>=1?1:1-Math.pow(2,-10*x),
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  io5:x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2,
  back:x=>{const c1=1.15,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}
};
const P=(t,a,b,e=E.out)=>e(clamp((t-a)/(b-a)));
const hx=h=>h[0]==='#'?[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]:h.match(/[\d.]+/g).map(Number);
const mixc=(a,b,m)=>{const A=hx(a),B=hx(b);return `rgb(${Math.round(lerp(A[0],B[0],m))},${Math.round(lerp(A[1],B[1],m))},${Math.round(lerp(A[2],B[2],m))})`};
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||document.body).appendChild(e);return e}

  {k:'U',name:'Urgences',col:'#E08A6D',n:3},

  {k:'N',name:'Newsletters',col:'#7C837B',n:26}
];

const MAILS=[
 ['N','Webinaire Digital','Dernières places pour jeudi','Inscrivez-vous avant ce soir pour recevoir le lien…','08:52'],
 ['F','Bauer Matériaux','Facture n°4471','Veuillez trouver ci-joint la facture de septembre…','08:51'],

 ['N','Formation Express','Votre attestation est disponible','Téléchargez-la depuis votre espace…','08:28'],

const ARR=MAILS.map((m,r)=>r<NARR? A0+(A1-A0)*Math.pow((NARR-1-r)/(NARR-1),0.6) : -1);

const GH=CAT.map((c,g)=>{const h=el('div','ghdr',list,`<i style="background:${c.col}"></i><b>${c.name}</b><span>${c.n}</span>`);return h});

// lignes

// tableau de bord (scène 6)
const TILES=['Priorités<br>identifiées','Réponses<br>préparées','Messages<br>classés'].map((t,i)=>{const d=el('div','tile',list,`<div class="ck">${CHECK}</div><div>${t}</div>`);d.style.left=(24+i*292)+'px';return d});

// vue message (scène 5)
const msg=el('div','a',win); msg.id='msg';
msg.innerHTML=`<div class="mh">‹&nbsp; Vos priorités</div>
<div class="av">CM</div><div class="mw">Claire Meyer</div><div class="ma">claire.meyer@exemple.fr</div><div class="mt">08:47</div>

  S(segLbl,{opacity:segIn});
  S(segA,{opacity:segIn,transform:`translateY(${(1-segIn)*20}px)`,background:'rgba(255,255,255,.04)',color:mixc('#C9CEC8','#80867F',sel),boxShadow:'inset 0 0 0 1px rgba(255,255,255,.12)'});
  const hov=P(t,23.9,24.2);
  S(segB,{opacity:segIn,transform:`translateY(${(1-segIn)*20}px) scale(${1+Math.sin(sel*Math.PI)*.02})`,background:`rgba(60,79,59,${(lerp(.0,.95,sel)+hov*.12).toFixed(3)})`,color:'#fff',
    boxShadow:`inset 0 0 0 ${lerp(1,2,sel)}px rgba(157,181,154,${lerp(.3,.9,Math.max(sel,hov*.6)).toFixed(2)})`});
  segB.innerHTML=(sel>.5?'<div class="ck" style="width:26px;height:26px">'+CHECK+'</div>':'')+'Relire et valider';
  const stA=P(t,24.85,25.3); S(status,{opacity:stA,transform:`translateY(${(1-stA)*16}px)`});
  status.querySelector('.send').style.boxShadow=`0 0 ${Math.round(P(t,25.4,25.9)*30)}px rgba(255,255,255,${(P(t,25.4,25.9)*.35).toFixed(2)})`;

  // textes
  CAPS.forEach(C=>{
    const n=C.words.length;
    C.words.forEach((w,i)=>{
      let ti;
      if(C.opt.times){ const per=[2,2]; const idx=i; ti=C.opt.times[Math.min(idx,C.opt.times.length-1)]; }
      else ti=C.tin+i*.07;
      const a=P(t,ti,ti+.55,E.quint);
      const o=C.opt.hard? (t<C.tout?1:0) : 1-P(t,C.tout-.05,C.tout+.35,E.out);
      S(w,{opacity:(a*o).toFixed(3),transform:`translateY(${((1-a)*28-(1-o)*14).toFixed(2)}px)`,filter:`blur(${((1-a)*10+(1-o)*6).toFixed(2)}px)`});
    });
  });
  // « Moins de temps… » s’efface légèrement quand la suite arrive
  CAPS[7].d.style.opacity=1-.25*P(t,29.75,30.3);

  // fin
  const ev=P(t,TL.logo-.3,TL.logo+.3);
  end.style.opacity=ev; end.style.display=ev>0?'block':'none';
  scrim.style.opacity=1-P(t,32.9,33.6);
  const la=P(t,TL.logo,TL.logo+1.0,E.quint);
  S(logo,{opacity:la,transform:`translateY(${(1-la)*30}px) scale(${lerp(1.06,1,la)})`,filter:`blur(${((1-la)*14).toFixed(2)}px)`});
  const gl=P(t,TL.logo+.55,TL.logo+1.6,E.io);
  S(logoG,{opacity:la*(gl>0&&gl<1?1:0),transform:`translateY(${(1-la)*30}px) scale(${lerp(1.06,1,la)})`,
    background:`linear-gradient(115deg,transparent ${lerp(-40,120,gl)-18}%,rgba(157,181,154,.95) ${lerp(-40,120,gl)}%,transparent ${lerp(-40,120,gl)+18}%)`});
  endGlow.style.opacity=P(t,TL.logo-.2,TL.logo+1.4)*(.85+.15*Math.sin(t*.8));
  endGlow.style.transform=`scale(${lerp(.85,1,P(t,TL.logo,TL.logo+3,E.out))})`;
  [endH,endB,endS].forEach(C=>C.words.forEach((w,i)=>{const ti=C.tin+i*.06;const a=P(t,ti,ti+.6,E.quint);S(w,{opacity:a,transform:`translateY(${(1-a)*22}px)`,filter:`blur(${((1-a)*8).toFixed(2)}px)`})}));
  const ca=P(t,35.0,35.6,E.quint);
  S(cta,{opacity:ca,transform:`translateY(${(1-ca)*24}px) scale(${lerp(.94,1,ca)})`,filter:`blur(${((1-ca)*8).toFixed(2)}px)`});

  // grain
  gctx.putImageData(GR[Math.floor(t*30)%GR.length],0,0);
};
window.ready=document.fonts.ready.then(()=>{window.render(0);return true});
</script>
