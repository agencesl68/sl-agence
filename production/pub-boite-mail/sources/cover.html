<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Geist";src:url("assets/Geist-Variable.woff2") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:var(--h);overflow:hidden;background:#070907}
body{font-family:"Geist",sans-serif;-webkit-font-smoothing:antialiased;color:#fff}
#bg{position:absolute;inset:-80px;perspective:1800px;filter:blur(7px) brightness(.5) saturate(.6)}
#plane{position:absolute;inset:0;transform:rotateX(14deg) rotateZ(-4deg) scale(1.08);transform-origin:50% 45%}
.card{position:absolute;width:470px;height:128px;border-radius:22px;background:#E9E8E2;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.card.d{background:#1a1f1a;box-shadow:inset 0 0 0 1.5px rgba(181,205,177,.3),0 30px 60px rgba(0,0,0,.5)}
.card b{position:absolute;left:46px;top:28px;font-size:27px;font-weight:600;color:#161a16}
.card s{position:absolute;left:46px;top:72px;font-size:22px;text-decoration:none;color:#5b605a}
.card i{position:absolute;left:22px;top:38px;width:11px;height:11px;border-radius:50%;background:#3C4F3B}
.card.d b{color:#eef1ec}.card.d s{color:#9aa199}
.card.d i{left:0;top:24px;width:6px;height:80px;border-radius:0 4px 4px 0}
.card u{position:absolute;right:22px;top:24px;font-size:17px;text-decoration:none;padding:6px 12px;border-radius:999px}
.badge{position:absolute;width:150px;height:150px;border-radius:40px;background:#C9573B;display:flex;align-items:center;justify-content:center;font-size:66px;font-weight:700;color:#fff;box-shadow:0 30px 60px rgba(0,0,0,.5)}
#tint{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 45% at 50% 46%,rgba(7,9,7,.55) 0%,rgba(7,9,7,.25) 60%,rgba(7,9,7,0) 100%),
  radial-gradient(ellipse 120% 90% at 50% 50%,rgba(60,79,59,.18) 0%,rgba(7,9,7,.0) 50%,rgba(7,9,7,.85) 100%),
  linear-gradient(180deg,rgba(7,9,7,.35),rgba(7,9,7,.1) 40%,rgba(7,9,7,.55))}
#c{position:absolute;left:0;width:1080px;text-align:center}
.k{font-size:46px;font-weight:450;color:rgba(255,255,255,.82);letter-spacing:-.01em}
.big{font-size:300px;font-weight:620;letter-spacing:-.06em;line-height:.9;margin-top:22px;
  background:linear-gradient(180deg,#fff 30%,#d9dcd6 100%);-webkit-background-clip:text;color:transparent}
.big small{font-size:150px;letter-spacing:-.04em}
.h2{font-size:84px;font-weight:600;letter-spacing:-.045em;line-height:1.02;margin-top:34px;color:#efefec}
.q{font-size:44px;font-weight:420;line-height:1.3;margin-top:70px;color:rgba(255,255,255,.8);letter-spacing:-.01em}
.q b{font-weight:600;color:#fff}
.rule{width:130px;height:2px;background:rgba(255,255,255,.7);margin:64px auto 0}
#logo{position:absolute;left:50%;width:150px;height:163px;margin-left:-75px;background:#fff;
  -webkit-mask:url("assets/logo-white.png") center/contain no-repeat}
#grain{position:absolute;inset:0;mix-blend-mode:overlay;opacity:.08}
</style></head>
<body>
<div id="bg"><div id="plane"></div></div>
<div id="tint"></div><div style="position:absolute;inset:0;background:#3C4F3B;mix-blend-mode:color;opacity:.6"></div>
<div id="c">
  <div class="k">Chaque matin,</div>
  <div class="big">60 <small>mails</small></div>
  <div class="h2">à trier avant même<br>de commencer.</div>
  <div class="q">Et si votre boîte mail<br><b>travaillait pour vous</b> ?</div>
  <div class="rule"></div>
</div>
<div id="logo"></div>
<canvas id="grain"></canvas>
<script>
const H=+new URLSearchParams(location.search).get('h')||1440;
document.documentElement.style.setProperty('--h',H+'px');
const plane=document.getElementById('plane');
const M=[['Garage Muller','Demande de devis'],['Fischer Compta','Facture F-2026-118'],['Claire Meyer','Intervention la semaine prochaine ?'],['Pro Hebdo','Les tendances de la semaine'],['Atelier Hoffmann','Fuite sur le chantier'],['Bauer Matériaux','Facture n°4471'],['Bureau+','−20 % sur les fournitures'],['Weber Terrassement','Relance : livraison'],['Cabinet Roth','Documents du mois'],['Sophie Haas','Photos du chantier'],['Schneider & Fils','Devis pour une toiture'],['Webinaire Digital','Dernières places']];
const TAG=[['Demande de devis','#B5CDB1'],['Factures','#D8C8A0'],['Clients','#A1D3FF'],['Urgences','#E08A6D']];
let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
let k=0;
for(let row=0;row<Math.ceil((H+260)/170);row++){for(let col=0;col<3;col++){
  const d=document.createElement('div');const dark=r()<.35;d.className='card'+(dark?' d':'');
  const m=M[k++%M.length];const t=TAG[k%TAG.length];
  d.innerHTML=`<i style="${dark?`background:${t[1]}`:''}"></i><b>${m[0]}</b><s>${m[1]}</s>${dark?`<u style="color:${t[1]};background:${t[1]}22">${t[0]}</u>`:''}`;
  d.style.left=(-140+col*520+(row%2)*170+r()*40)+'px';d.style.top=(-40+row*170+r()*30)+'px';
  d.style.transform=`translateZ(${(r()*160-80)|0}px)`;plane.appendChild(d)}}

// mise en page verticale centrée
const c=document.getElementById('c');const lg=document.getElementById('logo');
window.layout=()=>{const ch=c.offsetHeight;const top=Math.max(90,(H-ch-163-90)/2-10);c.style.top=top+'px';lg.style.top=(top+ch+80)+'px'};
const g=document.getElementById('grain');g.width=540;g.height=Math.ceil(H/2);g.style.width='1080px';g.style.height=H+'px';
const x=g.getContext('2d');const im=x.createImageData(g.width,g.height);let q=3;for(let i=0;i<im.data.length;i+=4){q=(q*48271)%2147483647;const v=q&255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}x.putImageData(im,0,0);
window.ready=document.fonts.ready.then(()=>{layout();return new Promise(r=>setTimeout(r,300))});
</script>
</body></html>
